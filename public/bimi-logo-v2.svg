<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a192f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#112240;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- White background circle (required for BIMI) -->
  <circle cx="100" cy="100" r="100" fill="#ffffff"/>
  
  <!-- Main circular background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Teal accent border -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#64ffda" stroke-width="3"/>
  
  <!-- <YD/> monogram in code style -->
  <text x="100" y="120" font-family="'Courier New', 'Courier', monospace" font-size="56" 
        font-weight="bold" fill="#64ffda" text-anchor="middle">&lt;YD/&gt;</text>
</svg>