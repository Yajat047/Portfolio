<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64ffda;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#33c9d9;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a192f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#112240;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- White background circle (required for BIMI) -->
  <circle cx="100" cy="100" r="100" fill="#ffffff"/>
  
  <!-- Gradient background -->
  <circle cx="100" cy="100" r="95" fill="url(#darkGradient)" filter="url(#shadow)"/>
  
  <!-- Accent border -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#logoGradient)" stroke-width="2.5"/>
  
  <!-- YD Initials with clean font -->
  <text x="100" y="125" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="url(#logoGradient)" letter-spacing="-2">YD</text>
  
  <!-- Subtle bottom accent line -->
  <rect x="60" y="135" width="80" height="1.5" fill="url(#logoGradient)" rx="0.75" opacity="0.6"/>
</svg>