<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0e17;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1926;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a786ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c5cdb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Accent line at top -->
  <rect width="1200" height="4" fill="url(#accentGradient)"/>
  
  <!-- Left accent shapes -->
  <circle cx="100" cy="100" r="50" fill="#a786ff" opacity="0.1"/>
  <circle cx="150" cy="150" r="30" fill="#a786ff" opacity="0.05"/>
  
  <!-- Right accent shapes -->
  <circle cx="1100" cy="530" r="60" fill="#a786ff" opacity="0.1"/>
  <circle cx="1050" cy="480" r="35" fill="#a786ff" opacity="0.05"/>
  
  <!-- Main content container -->
  <g>
    <!-- Name -->
    <text x="600" y="200" font-family="Arial, sans-serif" font-size="80" font-weight="bold" text-anchor="middle" fill="#ffffff">
      Yajat Dureja
    </text>
    
    <!-- Title with accent -->
    <text x="600" y="280" font-family="Arial, sans-serif" font-size="48" font-weight="600" text-anchor="middle" fill="#a786ff">
      Full Stack Developer
    </text>
    
    <!-- Subtitle -->
    <text x="600" y="340" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="#b8b8b8">
      React • Node.js • Cloud • DevOps
    </text>
    
    <!-- Tagline -->
    <text x="600" y="410" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#888888">
      Building innovative solutions with modern technology
    </text>
    
    <!-- Accent bar -->
    <rect x="300" y="450" width="600" height="3" fill="url(#accentGradient)"/>
    
    <!-- Contact info -->
    <text x="600" y="520" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#a786ff">
      github.com/Yajat047 • linkedin.com/in/yajat47
    </text>
  </g>
</svg>